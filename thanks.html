<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Vine & Vision People Development</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .thanks-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cream);
      padding: var(--sp-8);
      text-align: center;
    }
    .thanks-card {
      background: var(--white);
      border: var(--divider);
      border-radius: var(--radius-xl);
      padding: var(--sp-12);
      max-width: 540px;
      box-shadow: var(--shadow-md);
    }
    .thanks-icon {
      font-family: var(--font-display);
      font-size: 4rem;
      color: var(--gold);
      margin-bottom: var(--sp-4);
    }
  </style>
</head>
<body>
  <main id="main">
  <div class="thanks-wrap">
    <div class="thanks-card">
      <div class="thanks-icon">✦</div>
      <p class="eyebrow" style="margin-bottom: var(--sp-2);">Message received</p>
      <h1 style="font-size: var(--text-3xl); margin-bottom: var(--sp-3);">Thank you for reaching out</h1>
      <p style="color: var(--text-muted); margin-bottom: var(--sp-6); max-width: none;">Nicole will be in touch within one business day. In the meantime, feel free to explore our services or take our free assessment.</p>
      <div class="btn-group" style="justify-content: center; flex-wrap: wrap;">
        <a href="index.html" class="btn btn--primary">Back to Home</a>
        <a href="assessment.html" class="btn btn--secondary">Take the Assessment</a>
      </div>
    </div>
  </div>
  </main>
</body>
</html>
